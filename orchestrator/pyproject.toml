[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolframtas-orchestrator"
version = "0.1.0"
description = "Process orchestrator for the WolframTAS optimization pipeline."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wolframtas-orchestrator = "wolframtas_orchestrator.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
